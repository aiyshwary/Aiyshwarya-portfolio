<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#081226" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg)" />
  <rect x="40" y="40" width="720" height="400" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />

  <text x="60" y="100" font-family="Poppins, Arial, sans-serif" font-size="28" fill="#e6eef6" font-weight="600">Multi‑Agent Architecture</text>
  <text x="60" y="132" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#9aa4b2">Planner • Retriever • Tooling • Synthesizer</text>

  <rect x="80" y="190" width="180" height="90" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <text x="110" y="240" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#e6eef6">Planner</text>

  <rect x="310" y="190" width="180" height="90" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <text x="345" y="240" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#e6eef6">Retriever</text>

  <rect x="540" y="190" width="180" height="90" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <text x="585" y="240" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#e6eef6">Synthesizer</text>

  <line x1="260" y1="235" x2="310" y2="235" stroke="url(#accent)" stroke-width="4" />
  <line x1="490" y1="235" x2="540" y2="235" stroke="url(#accent)" stroke-width="4" />

  <rect x="310" y="320" width="180" height="60" rx="12" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.25)" />
  <text x="360" y="357" font-family="Poppins, Arial, sans-serif" font-size="14" fill="#8eeaf1">Tooling</text>

  <line x1="400" y1="280" x2="400" y2="320" stroke="url(#accent)" stroke-width="4" />
